# 提交门禁：把 docs/delivery-gates.md「每次提交必须满足」的检查交给 CI 强制执行。
#
# 覆盖范围与本地命令逐字一致：
#   - 后端：python -m pytest -o addopts="" 全量通过 + compileall 通过
#   - 网页管理台 / 手机伴侣端：vitest run（必须 run，避免 watch）+ 生产构建
#   - 桌面端：node --test（跳过 Electron 二进制下载，单测不需要运行时）
# 另有两个「默认会整体 skip」的 job（需外部资源，故单独立 job 并要求 `skipped == 0`）：
#   - postgres：真连库（service 起一次性 PG）；
#   - sandbox：真容器（按 digest 拉取钉死镜像，跑 §3.3 加固口径 + G5 逃逸回归 13 条）。
#
# 说明：本工作流只跑测试与编译，不引用任何密钥，权限收紧为只读。
# 已验证：push 触发 run 34591258934（v7 版工作流，4 个 job 全绿，33s；首次实跑为 run 34590744934）。
#   postgres job 已验证：run 34870650538 / 34873200739 均 success（run 级全绿）。
#   **sandbox job 尚未实跑**（2026-09-15 新增，尚无 push 触发的运行记录）——不得读成已通过。
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# 同一分支的新提交取消上一次未跑完的门禁，避免排队。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（pytest + compileall）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # 与 Dockerfile 的 python:3.12-slim 对齐；满足 requires-python>=3.11
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: pytest（全量）
        run: python -m pytest -o addopts=""
      - name: compileall
        run: python -m compileall -q app tests extract_pdf.py scripts

  admin-web:
    name: 网页管理台（vitest + build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # vite 8 / vitest 5 要求 Node 22+
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - name: 安装依赖（按 lockfile）
        run: npm ci
      - name: vitest
        run: npx vitest run
      - name: 生产构建
        run: npm run build

  companion-pwa:
    name: 手机伴侣端（vitest + build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion-pwa
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: companion-pwa/package-lock.json
      - name: 安装依赖（按 lockfile）
        run: npm ci
      - name: vitest
        run: npx vitest run
      - name: 生产构建
        run: npm run build

  desktop:
    name: 桌面端（node --test）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 安装依赖（跳过 Electron 二进制下载）
        run: npm ci --ignore-scripts
      - name: node --test
        run: node --test

  postgres:
    # 覆盖「真连库」的十五个模块：tests/test_tool_action_store_postgres.py、
    # tests/test_dsh_execution_postgres.py、tests/test_commercial_lifecycle_postgres.py、
    # tests/test_memory_postgres.py（P3 记忆层真库回归）、tests/test_skills_postgres.py（P4 技能层真库回归）、
    # tests/test_knowledge_governance_postgres.py（知识治理层真库回归，迁移 032）、
    # tests/test_evolution_postgres.py（P6a 评测集真库回归，迁移 033）、
    # tests/test_runtime_events_postgres.py（运行事件 append-only 表 + 保留期清理，迁移 034）
    # 与 tests/test_crm_postgres.py（P5a CRM 真库回归：转化单事务 / 复合外键 / 报价与回款，迁移 035）、
    # tests/test_conversation_stream_postgres.py（P2b 实时流）、tests/test_run_artifacts_postgres.py（P2c-3 产物）、
    # tests/test_conversation_lifecycle_postgres.py（P2c-4 模式 / 导出 / 物理删除）
    # 与 tests/test_conversation_members_postgres.py（P2c-6 成员表 + 消息 `sender_id`，迁移 039）。
    # 与 tests/test_retention_executor_postgres.py（B-4 选项 C 保留策略执行器：账本结转恒等式 /
    # 运行域先子后父 / 任务防孤儿谓词 / events+audit 两面不被触碰）。
    # 与 tests/test_tenant_purge_conversations_postgres.py（B1 清场扩围：会话层六张表整层清场 /
    # 外键顺序前提可执行断言 / 他租户零影响 / 服务端到端面名与逐表归零）。
    # 与 tests/test_tenant_purge_tasks_runs_postgres.py（B2+B3 清场扩围：任务与运行层整层清场 /
    # 分批循环收敛（limit=1）/ 套餐版本目录永不清理 / 服务端到端面名与逐表归零）。
    # 它们由 WORKBENCH_TEST_DATABASE_URL 门控，
    # 无该变量即**整体 skip**（默认 backend job 不提供 ⇒ 那时它们是 skip、不受守护）。
    # 本 job 提供一次性真库、按仓库自身 apply_migrations 建表，并要求 `skipped == 0`，
    # 从而把「默认 skip ⇒ 无人跑 ⇒ 假守护」堵死。
    name: 后端真库（Postgres service + *_postgres.py）
    runs-on: ubuntu-latest
    env:
      # 仅指向本 job 的临时 CI 容器；非真实环境凭据、不含任何仓库密钥。
      WORKBENCH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workbench
    services:
      postgres:
        # 与仓库既有一次性真库演练同源，按摘要钉死以防镜像漂移（pgvector 0.8.0 / PG16）。
        image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: 应用迁移（仓库自身的 app.migrations.apply_migrations）
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          from app.migrations import apply_migrations
          dsn = os.environ["WORKBENCH_TEST_DATABASE_URL"]
          with psycopg.connect(dsn) as conn:
              applied = apply_migrations(conn, Path("migrations"))
          print("newly applied:", applied)
          PY
      - name: 真库用例（必须真跑，skipped 必须为 0）
        run: |
          python -m pytest -o addopts="" \
            tests/test_tool_action_store_postgres.py \
            tests/test_dsh_execution_postgres.py \
            tests/test_commercial_lifecycle_postgres.py \
            tests/test_memory_postgres.py \
            tests/test_skills_postgres.py \
            tests/test_knowledge_governance_postgres.py \
            tests/test_evolution_postgres.py \
            tests/test_runtime_events_postgres.py \
            tests/test_crm_postgres.py \
            tests/test_conversation_stream_postgres.py \
            tests/test_run_artifacts_postgres.py \
            tests/test_conversation_lifecycle_postgres.py \
            tests/test_conversation_members_postgres.py \
            tests/test_retention_executor_postgres.py \
            tests/test_tenant_purge_conversations_postgres.py \
            tests/test_tenant_purge_tasks_runs_postgres.py \
            --junitxml=postgres-junit.xml
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("postgres-junit.xml").getroot()
          suites = root.findall(".//testsuite") or [root]
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          failed = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
          print(f"真库用例：tests={tests} skipped={skipped} failed={failed}")
          # 判定依据：模块整体 skip 时 pytest 仍返回 0 ⇒ 必须显式要求「真跑了且无一 skip」。
          sys.exit(0 if tests > 0 and skipped == 0 and failed == 0 else 1)
          PY

  sandbox:
    # 覆盖「真容器」的两组回归：
    #   - §3.3 加固口径与孤儿治理：tests/test_container_executor.py（含 G7′ tmpfs 归属/权限回归）；
    #   - G5 逃逸回归 13 条：tests/test_exec_sandbox_escape.py（规格 §5 用例 36–48）。
    # 两组均由「本机 Docker + 钉死镜像」门控 ⇒ 在默认 backend job 里是 skip、**不受守护**；
    # 本 job 按 digest 拉镜像后真跑，并要求 `skipped == 0`，把「默认 skip ⇒ 无人跑 ⇒ 假守护」堵死。
    # 该 job 同时是 G1/G3/G4 在 **Linux 宿主**上的复测点（逃逸用例 39–41 出网/DNS/云元数据、44 提权）；
    # **真实生产执行宿主（客户侧）不在此范围**（见规格 §8 U28）。
    name: 沙箱加固与逃逸回归（真容器）
    runs-on: ubuntu-latest
    env:
      # 与 Dockerfile:14 及两个测试文件同源的钉死镜像（tag 可变、digest 不可变）。
      EXEC_IMAGE: python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: 拉取钉死执行镜像（失败即本 job 失败，不静默降级为 skip）
        run: docker pull "$EXEC_IMAGE"
      - name: 真容器回归（必须真跑，skipped 必须为 0）
        run: |
          python -m pytest -o addopts="" \
            tests/test_container_executor.py \
            tests/test_exec_sandbox_escape.py \
            --junitxml=sandbox-junit.xml
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("sandbox-junit.xml").getroot()
          suites = root.findall(".//testsuite") or [root]
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          failed = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
          print(f"真容器用例：tests={tests} skipped={skipped} failed={failed}")
          # 判定依据：无 Docker / 缺钉死镜像时整组 skip 且 pytest 仍返回 0 ⇒ 必须要求无一 skip。
          sys.exit(0 if tests > 0 and skipped == 0 and failed == 0 else 1)
          PY
