# 公司数字员工工作台桌面端打包配置。
#
# 注意：当前**未配置代码签名与时间戳**：安装包构建需在具备证书的机器上完成，属未验收项。
# 本仓库的开发机没有安装 Electron、也没有代码签名证书，因此真实安装包构建、
# 代码签名、公证与干净电脑测试均尚未执行，禁止把本配置当作「已可发布」的依据。
appId: com.company.workbench.desktop
productName: 公司数字员工工作台
asar: true
directories:
  output: release
files:
  - "src/**"
  - "web/**"
  - "package.json"
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
# 自动更新的发布源：构建时必须由 WORKBENCH_DESKTOP_UPDATE_URL 注入（HTTPS），
# 且必须与运行时 desktop 的同名环境变量一致；electron-builder 据此生成 latest.yml。
# 未设置该变量时 `npm run dist` 会直接报错，避免打出没有更新元数据的安装包。
publish:
  - provider: generic
    url: ${env.WORKBENCH_DESKTOP_UPDATE_URL}
