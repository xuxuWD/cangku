# 执行回调边车编排（规格 §3.5 P1 第 3 条 ②④ / §8 U20 方案 b-1 / §8 U21 裁决「候选②」）—— **单独一个文件、按需启用**。
#
# 为什么**单独一个文件**、而不并入 docker-compose.app.yml：
#   本文件把 workbench-exec-internal / workbench-exec-callback 声明为 `external: true`，而 external
#   网络要求**预先存在**（顺序陷阱）。若并入 app 文件，会让**未建网 / 根本不用边车**的既有部署在
#   基础 `up` 时失败。单独成文 ⇒ 基础编排（docker-compose.yml + docker-compose.app.yml）**行为不变**。
#
# 顺序（必须，缺一不可）：
#   1) py scripts/ensure_exec_internal_network.py   # 预创建两条网桥（idempotent，同 executor 口径）
#   2) docker compose -f docker-compose.yml -f docker-compose.app.yml -f docker-compose.exec-callback.yml up -d
#
# 拓扑（§8 U21 裁决「候选②：边车纯转发 + 判定回工作台」）：
#   · 执行容器 **只**挂 workbench-exec-internal —— **可达边车、不可达工作台、不可达回调网**；
#   · **边车双宿** workbench-exec-internal + workbench-exec-callback（受控转发）；
#   · 工作台 app **只**额外接入 workbench-exec-callback（**不得**接入 workbench-exec-internal）；
#   · 边车**不做判定**（纯转发）；②④ 判定在**工作台**接收端点（`/api/v1/internal/exec-callback`）。
#
# 边界（红线，改动前先读规格）：
#   · 边车**只监听一个端口、只暴露一个端点**（`POST /internal/exec-callback`）；镜像内
#     **不得**烤入回调地址 / 预共享密钥（`FORWARD_URL` / `SHARED_SECRET` 由部署注入，缺失即拒绝启动）。
#   · `FORWARD_URL` 须指向**工作台侧回调接收端点**（`/api/v1/internal/exec-callback`）；
#     执行容器**不得**直连工作台。
#   · 边车 → 工作台 的鉴权 = **预共享密钥**（两侧同值，`WORKBENCH_EXEC_CALLBACK_SHARED_SECRET`）；
#     限流 = `100` rps（超限 `429`，工作台侧实现）。

services:
  app:
    # 工作台接入**回调网**（不是执行内网）：这是「边车 → 工作台」的唯一受控出向路径。
    # `default` 为 compose 项目默认网络（postgres / redis / seaweedfs 在这条网上）。
    networks:
      - default
      - workbench-exec-callback
    environment:
      # 「边车 → 工作台」预共享密钥（对称；两侧同值）。缺失即 `:?` 报错（fail-closed）。
      # **不得写进镜像 / 仓库**：由部署密钥系统注入。
      WORKBENCH_EXEC_CALLBACK_SHARED_SECRET: ${WORKBENCH_EXEC_CALLBACK_SHARED_SECRET:?set WORKBENCH_EXEC_CALLBACK_SHARED_SECRET in .env}

  exec-callback:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.exec_callback"]
    environment:
      WORKBENCH_EXEC_CALLBACK_LISTEN_HOST: ${WORKBENCH_EXEC_CALLBACK_LISTEN_HOST:-0.0.0.0}
      WORKBENCH_EXEC_CALLBACK_LISTEN_PORT: ${WORKBENCH_EXEC_CALLBACK_LISTEN_PORT:-8081}
      # 缺失即 `:?` 报错 ⇒ 边车拒绝启动（fail-closed）；不得给默认地址。
      WORKBENCH_EXEC_CALLBACK_FORWARD_URL: ${WORKBENCH_EXEC_CALLBACK_FORWARD_URL:?set WORKBENCH_EXEC_CALLBACK_FORWARD_URL in .env}
      # 缺失即 `:?` 报错 ⇒ 边车拒绝启动（fail-closed）；与工作台侧同值。
      WORKBENCH_EXEC_CALLBACK_SHARED_SECRET: ${WORKBENCH_EXEC_CALLBACK_SHARED_SECRET:?set WORKBENCH_EXEC_CALLBACK_SHARED_SECRET in .env}
    networks:
      # **双宿**：执行内网（收执行容器的回调）+ 回调网（把回调转给工作台）。
      - workbench-exec-internal
      - workbench-exec-callback
    # 边车只有那一个端点：关掉应用镜像自带的 /api/v1/health 健康检查（该端点在边车里不存在）。
    healthcheck:
      disable: true
    restart: unless-stopped

networks:
  # 执行内网桥：**预先存在**（先跑 scripts/ensure_exec_internal_network.py）。
  # 只有模型网关 + 执行回调边车 + 执行容器挂这里；工作台 app 容器**不得**加入。
  workbench-exec-internal:
    external: true
  # 回调网：**预先存在**；只有边车 + 工作台 app 挂这里；**执行容器绝不可达**。
  workbench-exec-callback:
    external: true
