services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: workbench
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: ${WORKBENCH_DB_PASSWORD:?set WORKBENCH_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - workbench-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - workbench-redis:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${WORKBENCH_MINIO_USER:?set WORKBENCH_MINIO_USER in .env}
      MINIO_ROOT_PASSWORD: ${WORKBENCH_MINIO_PASSWORD:?set WORKBENCH_MINIO_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - workbench-minio:/data

volumes:
  workbench-postgres:
  workbench-redis:
  workbench-minio:
